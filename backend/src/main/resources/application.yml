server:
  port: 8080

spring:
  application:
    name: acentra-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acentra_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:acentra_user}
    password: ${DB_PASSWORD:acentra_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:acentra_user}
    password: ${RABBITMQ_PASSWORD:acentra_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

acentra:
  rabbitmq:
    exchange:
      order: acentra.order.exchange
      retry: acentra.retry.exchange
      dlx: acentra.dlx
    queue:
      process: order.process.queue
      retry: order.retry.queue
      inventory: order.inventory.queue
      success: order.success.queue
      failed: order.failed.queue
      dlq: order.dlq
    routing-key:
      created: order.created
      retry: order.retry
      inventory: order.inventory
      completed: order.completed
      failed: order.failed
      deadletter: order.deadletter
    retry:
      max-attempts: 3
      delay-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.acentra: DEBUG
    org.hibernate.SQL: WARN
