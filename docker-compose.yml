version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # MySQL 8.0 Relational Database
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: acentra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: acentra_db
      MYSQL_USER: acentra_user
      MYSQL_PASSWORD: acentra_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - acentra-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # RabbitMQ Message Broker with Management UI
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: acentra-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: acentra_user
      RABBITMQ_DEFAULT_PASS: acentra_password
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - acentra-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Spring Boot Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acentra-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: acentra_db
      DB_USER: acentra_user
      DB_PASSWORD: acentra_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: acentra_user
      RABBITMQ_PASSWORD: acentra_password
      RABBITMQ_VHOST: /
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - acentra-net

networks:
  acentra-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local
